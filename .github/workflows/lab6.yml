
name: Build to ACR and Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Images to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Vote Service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-vote:${{ github.sha }} ./vote
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-vote:${{ github.sha }}
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-vote:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-vote:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-vote:latest

      - name: Build and Push Result Service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-result:${{ github.sha }} ./result
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-result:${{ github.sha }}
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-result:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-result:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-result:latest

      - name: Build and Push Worker Service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-worker:${{ github.sha }} ./worker
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-worker:${{ github.sha }}
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-worker:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-worker:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/voting-app-worker:latest

  deploy-to-vm:
    name: Deploy with Docker Compose on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

        - name: Check SSH key format
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key
          ssh-keygen -y -f ~/.ssh/azure_key > /dev/null
          echo "SSH key format is valid"
          
      - name: Copy docker-compose.yml to Azure VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VM_USERNAME }}/voting-app-deploy"

      - name: Deploy stack on Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USERNAME }}/voting-app-deploy

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}" > .env

            sudo docker compose pull
            sudo docker compose up -d --no-build --remove-orphans

            sudo docker image prune -f
